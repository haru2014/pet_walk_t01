name: CI (Backend Test & Frontend Build)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ========================================================
  # Job 1: Python 백엔드 및 AI 에이전트 단위 테스트 (pytest)
  # ========================================================
  backend-test:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 백엔드 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 단위 테스트 실행 (pytest)
        run: |
          pytest test_case/ -v

  # ========================================================
  # Job 2: 모바일 앱(React Native / Expo) 테스트 및 타입 검사
  # ========================================================
  mobile-app-ci:
    name: Mobile App Test & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 20 환경 설정
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 모바일 의존성 설치
        run: npm ci

      - name: 모바일 단위 테스트 (vitest)
        run: npm test

      - name: TypeScript 정적 타입 검사
        run: npx tsc --noEmit

  # ========================================================
  # Job 3: 모든 CI 테스트 통과 시 자동 머지 (Auto Merge)
  # ========================================================
  automerge:
    name: Auto Merge on CI Success
    needs: [backend-test, mobile-app-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: PR 자동 머지 활성화 (Squash & Merge)
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --auto --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ========================================================
  # Job 4: CI 성공 후 원본 main 커밋을 개인 포크 저장소로 반영
  # ========================================================
  sync-fork:
    name: Sync Main to Personal Fork
    needs: [backend-test, mobile-app-ci]
    runs-on: ubuntu-latest
    # 원본 저장소의 main에 push된 경우에만 실행한다.
    # 포크 저장소 자체에서 실행되는 재귀 동기화는 방지한다.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false

    steps:
      - name: 원본 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 포크 저장소 main으로 커밋 반영
        env:
          FORK_REPO: ${{ vars.FORK_REPO }}
          FORK_REPO_TOKEN: ${{ secrets.FORK_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${FORK_REPO:-}" ]; then
            echo "::error::Repository variable FORK_REPO가 설정되지 않았습니다."
            echo "예: your-github-username/your-fork-repository"
            exit 1
          fi

          if [ -z "${FORK_REPO_TOKEN:-}" ]; then
            echo "::error::Secret FORK_REPO_TOKEN이 설정되지 않았습니다."
            exit 1
          fi

          AUTH_HEADER="$(printf 'x-access-token:%s' "$FORK_REPO_TOKEN" | base64 -w 0)"

          git -c http.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
            push "https://github.com/${FORK_REPO}.git" \
            HEAD:refs/heads/main


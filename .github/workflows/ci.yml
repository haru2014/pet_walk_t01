name: CI (Backend Test & Frontend Build)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  # ========================================================
  # Job 1: Python 백엔드 및 AI 에이전트 단위 테스트 (pytest)
  # ========================================================
  backend-test:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 백엔드 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 단위 테스트 실행 (pytest)
        run: |
          pytest test_case/ -v

  # ========================================================
  # Job 2: 모바일 앱(React Native / Expo) 테스트 및 타입 검사
  # ========================================================
  mobile-app-ci:
    name: Mobile App Test & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 20 환경 설정
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 모바일 의존성 설치
        run: npm ci

      - name: 모바일 단위 테스트 (vitest)
        run: npm test

      - name: TypeScript 정적 타입 검사
        run: npx tsc --noEmit

  # ========================================================
  # Job 3: 모든 CI 테스트 통과 시 자동 머지 (Auto Merge)
  # ========================================================
  automerge:
    name: Auto Merge on CI Success
    needs: [backend-test, mobile-app-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: PR 자동 머지 실행 (Squash & Merge)
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" --squash --auto --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

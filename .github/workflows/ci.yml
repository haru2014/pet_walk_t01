name: CI (Backend Test & Frontend Build)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  # ========================================================
  # Job 1: Python 백엔드 및 AI 에이전트 단위 테스트 (pytest)
  # ========================================================
  backend-test:
    name: Backend Unit Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 백엔드 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 단위 테스트 실행 (pytest)
        run: |
          pytest test_case/ -v

  # ========================================================
  # Job 2: 프론트엔드 타입 검사 및 프로덕션 빌드 (Vite/TypeScript)
  # ========================================================
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 20 환경 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 의존성 설치
        run: npm ci

      - name: 프론트엔드 단위 테스트 (vitest)
        run: npm test

      - name: 프론트엔드 빌드 및 타입 검사
        run: npm run build
